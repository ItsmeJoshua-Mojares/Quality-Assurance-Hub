<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A93FF"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B2430" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square backdrop, matching the app's card/window aesthetic -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#1B2430"/>

  <!-- Shield -->
  <g filter="url(#softShadow)">
    <path d="M128 40
             L188 62
             C188 62 188 120 188 132
             C188 172 162 200 128 216
             C94 200 68 172 68 132
             C68 120 68 62 68 62
             Z"
          fill="url(#shieldGradient)"/>
  </g>

  <!-- Checkmark -->
  <path d="M98 130 L120 154 L162 104"
        fill="none" stroke="#FFFFFF" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
